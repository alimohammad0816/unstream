<!doctype html>
<!-- The build's own default, and what the document renders as before React
     mounts. The active language is chosen at run time (UNSTREAM_DEFAULT_LOCALE,
     or the visitor's saved pick) and applied to these two attributes before
     first paint — see src/lib/i18n.tsx. -->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint behind the notch and the home
         indicator, which is what an installed PWA should look like. It also
         makes env(safe-area-inset-*) report real values — everything pinned
         to an edge (the dock FAB, toasts, the footer) pads itself with them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Static, and in the build's default language: crawlers and social
         scrapers read the HTML without running the app, so these cannot follow
         the runtime locale. Translate them alongside UNSTREAM_DEFAULT_LOCALE if
         you change which language an instance leads with. -->
    <title>دانلود موزیک، آلبوم و پلی‌لیست از اسپاتیفای و یوتیوب | آنستریم</title>
    <meta
      name="description"
      content="لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت."
    />
    <meta name="theme-color" content="#0b0d0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="آنستریم" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter. When deploying, replace the og:url and og:image
         values with absolute URLs on your domain — scrapers need them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="آنستریم" />
    <meta property="og:locale" content="fa_IR" />
    <meta
      property="og:title"
      content="دانلود موزیک، آلبوم و پلی‌لیست از اسپاتیفای و یوتیوب | آنستریم"
    />
    <meta
      property="og:description"
      content="لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="دانلود موزیک، آلبوم و پلی‌لیست از اسپاتیفای و یوتیوب | آنستریم"
    />
    <meta
      name="twitter:description"
      content="لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت."
    />
    <meta name="twitter:image" content="/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "آنستریم",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "inLanguage": "fa",
        "description": "لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت.",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>

    <!-- Self-hosted Vazirmatn (docs/DESIGN.md): the four weights the UI uses from
         the plain cut that is the document default, plus the FD regular — Farsi
         is the default language, and without it every Persian title swaps digit
         shapes after first paint. The remaining FD weights are fetched on demand.
         hrefs must match the url()s in index.css byte-for-byte, and font preloads
         need crossorigin even same-origin, or they download twice. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-Medium.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-SemiBold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-Bold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-FD-Regular.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config, generated from the container's environment at start-up
         (frontend/docker-entrypoint.d/). A classic script, so it runs before
         the deferred module below and the app can read the configured default
         locale synchronously. Not present in the repo; served in dev by a Vite
         middleware, so nothing 404s. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
